name: Create GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          BACKEND_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' backend/pyproject.toml)

          if [ "$FRONTEND_VERSION" != "$VERSION" ]; then
            echo "Frontend version $FRONTEND_VERSION does not match tag $TAG" >&2
            exit 1
          fi

          if [ "$BACKEND_VERSION" != "$VERSION" ]; then
            echo "Backend version $BACKEND_VERSION does not match tag $TAG" >&2
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CONTENT=$(sed -n "/^## \[$TAG\]/,/^## \[/{/^## \[$TAG\]/d;/^## \[/q;p}" CHANGELOG.md)

          if [ -z "$CONTENT" ]; then
            echo "No changelog entry found for $TAG" >&2
            exit 1
          fi

          DELIMITER="EOF_$(openssl rand -hex 16)"
          {
            echo "content<<$DELIMITER"
            echo "$CONTENT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
